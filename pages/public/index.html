  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone {
      width: 320px;
      min-height: 660px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 28px 32px;
      position: relative;
    }

    /* Logo */
    .logo {
      width: 130px;
      margin-bottom: 40px;
    }

    /* Heading */
    .heading {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.05;
      align-self: flex-start;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    /* Arrow + Start Here area */
    .cta-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 12px;
      margin-bottom: 24px;
      position: relative;
    }

    .arrow-wrap {
      align-self: flex-end;
      margin-right: 16px;
      margin-bottom: -4px;
    }

    .start-here {
      font-size: 13px;
      font-weight: 500;
      color: #888;
      font-style: italic;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }

    /* CTA Button */
    .btn {
      width: 100%;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 20px 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    .btn:active { transform: translateY(0); }

    /* Stats */
    .stats {
      margin-top: 28px;
      text-align: center;
      line-height: 1.9;
    }
    .stats p {
      font-size: 10.5px;
      font-weight: 500;
      color: #444;
    }
    .stats span {
      font-weight: 700;
      color: #000;
    }
  </style>
</head>
